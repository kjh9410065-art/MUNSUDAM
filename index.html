<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="문서담 - 필요한 문서를 선택하고 내용만 입력하면 바로 완성하는 문서 양식 서비스">
<title>문서담 | 문서 양식 작성</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header"><div class="wrap nav"><a class="brand" href="#">문서담</a><span class="tag">필요한 문서를 간편하게</span></div></header>
<main class="wrap">
<section class="hero"><p class="eyebrow">DOCUMENT DAM</p><h1>필요한 문서를<br><strong>내용만 입력해서 완성하세요.</strong></h1><p>사직서, 위임장, 차용증 등 자주 쓰는 문서를 간단하게 작성하고 바로 인쇄할 수 있습니다.</p></section>
<section class="toolbar"><input id="search" type="search" placeholder="문서 이름을 검색하세요"><div id="categories" class="categories"></div></section>
<section id="cards" class="cards"></section>
<section id="editor" class="editor hidden"></section>
</main>
<footer><div class="wrap">문서담 · 입력한 내용은 서버로 전송되지 않습니다.</div></footer>
<script src="script.js"></script>
</body>
</html>
