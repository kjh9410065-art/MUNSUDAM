name: MUNSUDAM isolated preview
on:
  push:
    branches: ['preview/all-features-20261026']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate document preview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('feature-preview.html').read_text()
          for item in ['id="persistent"','id="profileSave"','id="sheet"','id="sign"','id="pdf"','@page{size:A4','noindex,nofollow']:
              assert item in s,item
          assert s.count('id:"')>=20
          print('MUNSUDAM preview source checks passed')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: munsudam-feature-preview
          path: feature-preview.html
          retention-days: 14
